name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs reads tags to compute the project version at install time
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync

      - run: uv run pytest -m "not integration"

  # Heavy: boots Trino + MinIO + Postgres. Gated to PRs targeting master and
  # manual dispatch, so it doesn't run on every branch push. First CI lane for
  # the whole tests/integration suite (run manually/locally before this).
  integration:
    runs-on: ubuntu-latest
    needs: lint
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'master')
    steps:
      - uses: actions/checkout@v4

      - name: Start Trino + MinIO + Postgres
        run: docker compose -f tests/docker-compose.yml up -d --wait trino

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync

      - name: Run integration tests
        env:
          TRINO_HOST: localhost
          TRINO_PORT: "18080"
        run: uv run pytest -m integration

      - name: Trino logs on failure
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs trino

      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v

  publish:
    runs-on: ubuntu-latest
    needs: test
    # Publish only on version tags — no per-master-push or per-branch images.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only tags reach this job (see gate above), so `latest` always
            # points at the most recently tagged release.
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # metadata-action parses `refs/tags/v0.1.1` → `0.1.1`; the Dockerfile
          # forwards it to SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ICEBERG_IVM
          # so hatch-vcs bakes the correct version into the built package.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
