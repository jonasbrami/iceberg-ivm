services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: iceberg
    volumes:
      - ./trino-config/init-iceberg-catalog.sql:/docker-entrypoint-initdb.d/init.sql
      - catalog:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 10

  trino:
    image: jonasbrami/trino-arrow:479-03d1b24
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./trino-config/iceberg.properties:/etc/trino/catalog/iceberg.properties
      # Iceberg data and metadata files live here (Trino's local filesystem).
      - warehouse:/data/trino
    ports:
      # Loopback-only: Trino has no auth in the quickstart and the host port
      # must stay in sync with TRINO_PUBLIC_URL below (28080).
      - "127.0.0.1:28080:8080"
    healthcheck:
      test: trino --execute "SELECT 1"
      interval: 5s
      retries: 30
      start_period: 30s

  seed:
    build:
      context: ./seed
    depends_on:
      trino:
        condition: service_healthy
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: seed
    restart: "no"

  iceberg-ivm:
    image: ghcr.io/jonasbrami/iceberg-ivm:latest
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      TRINO_URL: http://trino:8080
      # The orchestrator stores the info_uri Trino returns for each query and
      # exposes it as a deep-link in the UI. Trino derives info_uri from the
      # client's request URL, so without this override the deep-link points
      # at the docker-internal hostname `trino:8080`, which doesn't resolve
      # from the user's browser. Pointing public_url at the published port
      # makes the link reachable from the host.
      TRINO_PUBLIC_URL: http://localhost:28080
      TRINO_USER: iceberg-ivm
    volumes:
      - ./config.yaml:/data/config.yaml
      - ./views.yaml:/data/views.yaml
      - ivm-state:/data/state
    command: ["-c", "/data/config.yaml", "--views", "/data/views.yaml"]
    ports:
      # Loopback-only: the orchestrator UI has no auth in the quickstart.
      - "127.0.0.1:8001:8000"

volumes:
  catalog:
  warehouse:
  ivm-state:
