# Integration-test stack: Trino + a Postgres-backed Iceberg JDBC catalog.
# The warehouse lives on Trino's local filesystem, so no object store is needed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: iceberg
    volumes:
      - ./trino-config/init-iceberg-catalog.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 10

  trino:
    image: jonasbrami/trino-arrow:479-03d1b24
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./trino-config/iceberg.properties:/etc/trino/catalog/iceberg.properties
    tmpfs:
      - /tmp/warehouse:mode=1777
    ports:
      - "18080:8080"
    healthcheck:
      test: trino --execute "SELECT 1"
      interval: 5s
      retries: 30
      start_period: 30s
